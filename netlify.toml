[build]
  publish = "."
  functions = "netlify/functions"
  # 1) Divide codigos-de-etica-salud-chile.md en fragmentos para el chat.
  # 2) Crea una página por sección, curso, caso, término e institución, y sitemap.xml.
  command = "node preparar_fragmentos.js && node generar_paginas.js"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Archivos internos del proyecto: están en GitHub, pero no deben verse en el sitio
# (por ejemplo, CLAUDE.md tiene el correo de contacto). Responden "página no encontrada".
# Si agregas un archivo interno nuevo en la carpeta principal, súmalo a esta lista.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/generar_paginas.js"
